name: Feature
description: A new user-facing capability
type: Feature
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a user not do today? Write it from their perspective, not the implementation's.
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true once this ships?
    validations: { required: true }
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Testable and enumerated. If you cannot test it, it is not a criterion.
      value: |
        - [ ] 
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What this deliberately does not cover.
  - type: textarea
    id: deps
    attributes:
      label: Dependencies
      description: Link blocking issues with GitHub's "blocked by" relationship rather than describing them here.

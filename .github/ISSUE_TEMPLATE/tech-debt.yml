name: Tech Debt
description: Rework that lowers future cost, with no user-visible change
type: Tech Debt
labels: ["needs-triage"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current state
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: Why it costs us
      description: Concretely — what is slower, riskier or more error-prone because of this?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations: { required: true }
  - type: textarea
    id: risk
    attributes:
      label: Risk of doing it
      description: Blast radius, migration needs, rollback plan.

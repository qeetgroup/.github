name: Security
description: Hardening or compliance work — NOT for reporting a live vulnerability
type: Security
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        > **Do not report an exploitable vulnerability here.** This repository is public.
        > Use private vulnerability reporting (Security → Report a vulnerability) instead.
        > This form is for planned hardening, compliance and remediation work only.
  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: What is weak today, and what could an attacker do with it?
    validations: { required: true }
  - type: dropdown
    id: severity
    attributes:
      label: Assessed risk
      options: ["Critical", "High", "Medium", "Low"]
    validations: { required: true }
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Tenant isolation, credentials, tokens, sessions, audit integrity?
    validations: { required: true }
  - type: textarea
    id: mitigation
    attributes:
      label: Mitigation
    validations: { required: true }
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How will we prove this is fixed?
    validations: { required: true }

name: Bug
description: Behaviour that contradicts the spec or a reasonable expectation
type: Bug
labels: ["needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      description: Environment, version/tag, browser or SDK version.
    validations: { required: true }
  - type: dropdown
    id: regression
    attributes:
      label: Regression?
      options: ["Unknown", "Yes — worked before", "No — never worked"]
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Logs / evidence
      description: Redact tokens, cookies and PII before pasting.
